<!--
  Vstup do klientské zóny z webu. Tlačítko „Klientská zóna“ na profil.html
  vede sem a odtud se přesměruje do samostatné klientské zóny
  (repo REA-MODUS, portal.html; obsah zveřejňuje poradce z REA).

  PORTAL_URL: ostrá adresa klientské zóny. Na localhost se přesměruje
  na vývojový server REA (:5179). Když je PORTAL_URL prázdná a nejde
  o localhost, ukáže se tahle stránka s kontaktem, nic se nerozbije.
  Hash (#…) se předává dál, takže odkaz z pozvánky #pozvanka/… projde.
-->
<script>
  (function () {
    var PORTAL_URL = 'https://rea-modus.vercel.app/portal.html';
    var lokalne = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    var cil = lokalne ? 'http://localhost:5179/portal.html' : PORTAL_URL;
    if (cil) location.replace(cil + location.hash);
  })();
</script>
